<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beri Ulasan & Rating - BRISE</title>
    <style>
        /* Reset dan Base Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Latar belakang soft pink/peach sesuai desain */
            background-color: #FDF3F2; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        /* Bagian Header Ulasan */
        .review-section {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .review-header {
            text-align: center;
            margin-bottom: 30px;
            /* Warna merah maroon/gelap untuk teks header */
            color: #8C1C13; 
        }

        .review-header h2 {
            font-family: 'Georgia', serif; /* Font serif agar mirip logo/judul */
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .review-header p {
            font-size: 15px;
            line-height: 1.5;
        }

        /* Container Form (Kotak Putih) */
        .review-form-container {
            background-color: #FFFFFF;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #111;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #E0E0E0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            color: #333;
            transition: border-color 0.3s;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #A0A0A0;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #8C1C13;
        }

        /* Styling untuk Rating Bintang */
        .rating-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stars {
            display: flex;
            gap: 5px;
            color: #D3D3D3; /* Warna bintang kosong */
            font-size: 24px;
            cursor: pointer;
        }

        .star {
            transition: color 0.2s;
        }

        .star:hover,
        .star.active {
            color: #FFC107; /* Warna bintang kuning saat dihover/aktif */
        }

        .rating-text {
            font-size: 13px;
            color: #888;
        }

        /* Tombol Kirim Ulasan */
        .submit-btn {
            background-color: #8C1C13;
            color: #FFFFFF;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #6a130e;
        }

    </style>
</head>
<body>

    <section class="review-section">
        <!-- Judul & Deskripsi -->
        <div class="review-header">
            <h2>Beri Ulasan & Rating</h2>
            <p>Terima kasih sudah berkunjung ke BRISE!<br>Bagaimana pengalaman kunjunganmu? Ceritakan kepada kami melalui ulasanmu.</p>
        </div>

        <!-- Form Ulasan -->
        <div class="review-form-container">
            <form action="#" method="POST">
                
                <!-- Input Nama -->
                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" placeholder="Tulis namamu">
                </div>

                <!-- Input Rating -->
                <div class="form-group">
                    <label>Rating</label>
                    <div class="rating-group">
                        <div class="stars">
                            <span class="star">&#9734;</span>
                            <span class="star">&#9734;</span>
                            <span class="star">&#9734;</span>
                            <span class="star">&#9734;</span>
                            <span class="star">&#9734;</span>
                        </div>
                        <span class="rating-text">Pilih ratingmu</span>
                    </div>
                </div>

                <!-- Input Ulasan -->
                <div class="form-group">
                    <label for="ulasan">Ulasan</label>
                    <textarea id="ulasan" name="ulasan" rows="5" placeholder="Ceritakan pengalamanmu di BRISE, mulai dari menu favorit, suasana, hingga pelayanan kami..."></textarea>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" class="submit-btn">Kirim Ulasan</button>

            </form>
        </div>
    </section>

    <!-- Sedikit JavaScript agar rating bintang bisa diklik (interaktif) -->
    <script>
        const stars = document.querySelectorAll('.star');
        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                // Reset semua bintang ke outline (kosong)
                stars.forEach(s => s.innerHTML = '&#9734;');
                
                // Isi bintang (solid) dari awal sampai index yang diklik
                for(let i = 0; i <= index; i++) {
                    stars[i].innerHTML = '&#9733;';
                    stars[i].classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
